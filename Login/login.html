<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | QUASAR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" 
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../Login/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <!-- Logo y Título -->
            <div class="text-center mb-4">
                <i class="bi bi-stars text-warning" style="font-size: 3rem;"></i>
                <h2 class="text-warning mt-2 mb-1">QUASAR SYSTEM</h2>
                <p class="text-muted small">Sistema de Gestión y Control</p>
            </div>
            
            <!-- Tabs de Login/Registro -->
            <ul class="nav nav-pills nav-fill mb-3" id="pills-tab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="login-tab" data-bs-toggle="pill" 
                            data-bs-target="#login" type="button" role="tab" 
                            aria-controls="login" aria-selected="true">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="register-tab" data-bs-toggle="pill" 
                            data-bs-target="#register" type="button" role="tab" 
                            aria-controls="register" aria-selected="false">
                        <i class="bi bi-person-plus me-1"></i> Registro
                    </button>
                </li>
            </ul>

            <!-- Contenido de los Tabs -->
            <div class="tab-content" id="pills-tabContent">
                <!-- Tab de Login -->
                <div class="tab-pane fade show active" id="login" role="tabpanel" aria-labelledby="login-tab">
                    <form id="loginForm" novalidate>
                        <div class="mb-3">
                            <label for="logUser" class="form-label small text-muted">
                                <i class="bi bi-person-circle me-1"></i> Usuario
                            </label>
                            <input type="text" id="logUser" class="form-control" 
                                   placeholder="Ingresa tu usuario" 
                                   autocomplete="username"
                                   maxlength="50"
                                   required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="logPass" class="form-label small text-muted">
                                <i class="bi bi-lock-fill me-1"></i> Contraseña
                            </label>
                            <input type="password" id="logPass" class="form-control" 
                                   placeholder="Ingresa tu contraseña"
                                   autocomplete="current-password"
                                   required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
                        </button>
                        
                        <div class="text-center mt-3">
                            <small class="text-muted">
                                ¿No tienes cuenta? 
                                <a href="#" class="text-warning" data-bs-toggle="pill" data-bs-target="#register">
                                    Regístrate aquí
                                </a>
                            </small>
                        </div>
                    </form>
                </div>
                
                <!-- Tab de Registro -->
                <div class="tab-pane fade" id="register" role="tabpanel" aria-labelledby="register-tab">
                    <form id="registerForm" novalidate>
                        <div class="mb-3">
                            <label for="regName" class="form-label small text-muted">
                                <i class="bi bi-person-badge me-1"></i> Nombre Completo
                            </label>
                            <input type="text" id="regName" class="form-control" 
                                   placeholder="Ej: Juan Pérez" 
                                   autocomplete="name"
                                   maxlength="100"
                                   required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="regUser" class="form-label small text-muted">
                                <i class="bi bi-person-circle me-1"></i> Usuario
                            </label>
                            <input type="text" id="regUser" class="form-control" 
                                   placeholder="Ej: juan123" 
                                   autocomplete="username"
                                   maxlength="50"
                                   pattern="[a-zA-Z0-9_]+"
                                   required>
                            <small class="form-text text-muted">Solo letras, números y guiones bajos</small>
                        </div>
                        
                        <div class="mb-3">
                            <label for="regPass" class="form-label small text-muted">
                                <i class="bi bi-lock-fill me-1"></i> Contraseña
                            </label>
                            <input type="password" id="regPass" class="form-control" 
                                   placeholder="Mínimo 4 caracteres"
                                   autocomplete="new-password"
                                   minlength="4"
                                   required>
                        </div>
                        
                        <button type="submit" class="btn btn-outline-light w-100">
                            <i class="bi bi-person-plus me-1"></i> Crear Cuenta
                        </button>
                        
                        <div class="text-center mt-3">
                            <small class="text-muted">
                                ¿Ya tienes cuenta? 
                                <a href="#" class="text-warning" data-bs-toggle="pill" data-bs-target="#login">
                                    Inicia sesión
                                </a>
                            </small>
                        </div>
                    </form>
                </div>
            </div>
            
            <!-- Mensaje de Alerta -->
            <div id="alertMsg" class="mt-3 text-center small" role="alert"></div>
            
            <!-- Información de Demo -->
            <div class="demo-info mt-4 p-3 rounded">
                <p class="small text-muted mb-2 text-center">
                    <i class="bi bi-info-circle me-1"></i> <strong>Credenciales de prueba:</strong>
                </p>
                <div class="row g-2">
                    <div class="col-6">
                        <small class="text-muted d-block">Admin:</small>
                        <code class="small">admin / 1234</code>
                    </div>
                    <div class="col-6">
                        <small class="text-muted d-block">Usuario:</small>
                        <code class="small">user / 1234</code>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
            crossorigin="anonymous"></script>
    <script src="../Login/db.js"></script>
    <script src="../Login/login.js"></script>
</body>
</html>
