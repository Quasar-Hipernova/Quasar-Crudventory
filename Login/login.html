<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso | QUASAR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2 class="text-warning text-center mb-4">QUASAR SYSTEM</h2>
            
            <ul class="nav nav-pills nav-fill mb-3" id="pills-tab">
                <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#login">Entrar</button></li>
                <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#register">Registro</button></li>
            </ul>

            <div class="tab-content">
                <div class="tab-pane fade show active" id="login">
                    <form id="loginForm">
                        <input type="text" id="logUser" class="form-control mb-2" placeholder="Usuario" required>
                        <input type="password" id="logPass" class="form-control mb-3" placeholder="Contraseña" required>
                        <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
                    </form>
                </div>
                <div class="tab-pane fade" id="register">
                    <form id="registerForm">
                        <input type="text" id="regName" class="form-control mb-2" placeholder="Nombre" required>
                        <input type="text" id="regUser" class="form-control mb-2" placeholder="Usuario" required>
                        <input type="password" id="regPass" class="form-control mb-3" placeholder="Contraseña" required>
                        <button type="submit" class="btn btn-outline-light w-100">Crear Cuenta</button>
                    </form>
                </div>
            </div>
            <p id="alertMsg" class="mt-3 text-danger text-center small"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./login.js"></script>
    <script src="./db.js"></script>
</body>
</html>
