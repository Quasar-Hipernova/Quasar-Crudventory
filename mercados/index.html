        <a class="navbar-brand fw-bold text-primary" href="#">
        Mercado Hogar
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
        </button>

        <!-- MENU -->
        <div class="collapse navbar-collapse" id="menu">

      <!-- LINKS -->
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
            <a class="nav-link" href="#">Categorías</a>
            </li>
            <li class="nav-item">

      <div class="d-flex align-items-center gap-3">

          Login

      </div>

<section class="hero">
  <div class="container">
    <h1>Todo lo que tu hogar necesita en un solo lugar</h1>
  </div>
</section>

<!-- SECCIÓN -->
<div class="container my-5">
  <h4 class="mb-4 text-center">Categorías</h4>

  <div class="row justify-content-center text-center">
    
    <div class="col-lg-3 col-md-6 col-6 mb-3">
      <div class="card product-card h-100 p-4 d-flex flex-column align-items-center justify-content-center">
        <i class="fa-solid fa-broom fa-3x mb-3"></i>
        <h6 class="mb-0">Aseo y Hogar</h6>
      </div>
    </div>

    <div class="col-lg-3 col-md-6 col-6 mb-3">
      <div class="card product-card h-100 p-4 d-flex flex-column align-items-center justify-content-center">
        <i class="fa-solid fa-carrot fa-3x mb-3"></i>
        <h6 class="mb-0">Verduras</h6>
      </div>
    </div>
    

    <div class="col-lg-3 col-md-6 col-6 mb-3">
      <div class="card product-card h-100 p-4 d-flex flex-column align-items-center justify-content-center">
        <i class="fa-solid fa-bread-slice fa-3x mb-3"></i>
        <h6 class="mb-0">Despensa</h6>
      </div>
    </div>
    <div class="col-lg-3 col-md-6 col-6 mb-3">
      <div class="card product-card h-100 p-4 d-flex flex-column align-items-center justify-content-center">
        <i class="fa-solid fa-bacon fa-3x mb-3"></i>
        <h6 class="mb-0">Pollo y Carnes</h6>
      </div>
    </div>

  </div>
  </div>
  <!-- carruseles  -->
  <div class="container my-5">
    <h4 class="mb-4 text-center">Ofertas Destacadas</h4>
    <div id="carouselDestacados" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner" id="contenedor-destacados"></div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselDestacados" data-bs-slide="prev">
            <span class="carousel-control-prev-icon bg-dark rounded-circle"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselDestacados" data-bs-slide="next">
            <span class="carousel-control-next-icon bg-dark rounded-circle"></span>
        </button>
    </div>
</div>

<div class="container my-5">
    <h4 class="mb-4 text-center">Aseo y Hogar</h4>
    <div id="carouselAseo" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner" id="contenedor-aseo"></div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselAseo" data-bs-slide="prev">
            <span class="carousel-control-prev-icon bg-dark rounded-circle"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselAseo" data-bs-slide="next">
            <span class="carousel-control-next-icon bg-dark rounded-circle"></span>
        </button>
    </div>
</div>

<div class="container my-5">
    <h4 class="mb-4 text-center">Verduras Frescas</h4>
    <div id="carouselVerduras" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner" id="contenedor-verduras"></div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselVerduras" data-bs-slide="prev">
            <span class="carousel-control-prev-icon bg-dark rounded-circle"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselVerduras" data-bs-slide="next">
            <span class="carousel-control-next-icon bg-dark rounded-circle"></span>
        </button>
    </div>
</div>
